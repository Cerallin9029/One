name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LENS_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$LENS_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version tag such as v0.1.0"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.LENS_RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["LENS_RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag and package version disagree")
          PY
      - run: python -m pip install . ruff==0.11.13 build==1.2.2.post1
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Test built wheel and generate checksums
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          wheel-smoke/bin/python -m unittest discover -s tests -v
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = sorted(p for p in Path("dist").iterdir() if p.name.endswith((".whl", ".tar.gz")))
          if len(paths) != 2:
              raise SystemExit("Expected exactly one wheel and one source archive")
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in paths]
          Path("dist/SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          PY
      - name: Publish release with installation assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.LENS_RELEASE_TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) {
              core.notice(`${tag} is already published; leaving it unchanged.`);
              return;
            }
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
            const heading = changelog.findIndex(line => line.startsWith(`## ${tag.slice(1)} `));
            const changes = [];
            if (heading !== -1) {
              for (const line of changelog.slice(heading + 1)) {
                if (line.startsWith('## ')) break;
                changes.push(line);
              }
            }
            const summary = changes.join('\n').trim();
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Codex Instruction Lens ${tag}`,
                draft: true, prerelease: false,
                body: (summary ? summary + '\n\n' : '')
                  + 'Explain Codex project instruction selection, overrides and byte budgets.\n\n'
                  + 'Requires Python 3.11+. Install the attached wheel with `python -m pip install FILE.whl`, '
                  + 'then run `codex-instruction-lens .`. No runtime dependencies or model API calls.\n\n'
                  + 'Includes a source archive and SHA-256 checksums. This alpha models project documents '
                  + 'with explicit settings; it does not audit a running session or load Codex configuration. '
                  + 'See README and docs/COMPATIBILITY.md in the tagged source for details.'
              })).data;
            }
            const assets = fs.readdirSync('dist').filter(
              name => name.endsWith('.whl') || name.endsWith('.tar.gz') || name === 'SHA256SUMS'
            ).sort();
            if (assets.length !== 3) throw new Error('Expected three release assets');
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            for (const name of assets) {
              const previous = existing.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: previous.id });
              const data = fs.readFileSync(path.join('dist', name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
            core.notice(`Published ${tag}: ${release.html_url}`);
